name: Zero Trust Policy Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run Rego tests
        run: opa test policy -v
      - name: Verify compliant fixture passes
        run: |
          count="$(opa eval --format raw --data policy --input examples/compliant-plan.json 'count(data.terraform.guardrails.deny)')"
          test "$count" = "0"
      - name: Verify noncompliant fixture is rejected
        run: |
          count="$(opa eval --format raw --data policy --input examples/noncompliant-plan.json 'count(data.terraform.guardrails.deny)')"
          test "$count" -ge "1"
          opa eval --format pretty --data policy --input examples/noncompliant-plan.json 'data.terraform.guardrails.violations'
